<!doctype html>
<!--
  MACARIO — _dev/player-test.html

  A test bench for Macario's new sheets (animate-player.js), before they
  go into game.js: him on a street that scrolls at the game's real speed
  (300 world px a second) and zoom (1.75), next to the Macario of today.
  Hold the arrow keys (or the buttons) to run; let go to stand.

  The yellow ticks are the ground. A planted foot should stay on its
  tick until it lifts; that is the stride lock. "Today's frame timer"
  steps frames the way game.js does now (waiting for the next screen
  refresh after each frame's time is up), to show how much slower the
  sheets play with it.

  Open it from the project folder (double-click, or any local server).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macario test bench</title>
<style>
  body { margin: 0; background: #1b1b1b; color: #eee; font: 14px system-ui, sans-serif; }
  main { max-width: 1140px; margin: 0 auto; padding: 16px; }
  canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 12px 0; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #555; background: #2b2b2b; color: #eee; }
  button:active { background: #444; }
  label { user-select: none; }
  #info { color: #aaa; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:18px;margin:0 0 8px">Macario test bench</h1>
  <canvas id="c" width="1120" height="440"></canvas>
  <div class="bar">
    <button id="left">&larr; Run left</button>
    <button id="right">Run right &rarr;</button>
    <label><input type="radio" name="who" value="both" checked> Both</label>
    <label><input type="radio" name="who" value="new"> New only</label>
    <label><input type="radio" name="who" value="old"> Today's only</label>
    <label><input type="checkbox" id="oldTimer"> Today's frame timer</label>
    <label><input type="checkbox" id="slow"> Quarter speed</label>
  </div>
  <div id="info"></div>
</main>
<script>
"use strict";
const ZOOM = 1.75, DISPLAY_HEIGHT = 134, SPEED = 300; // world px, world px/s
const H = DISPLAY_HEIGHT * ZOOM;
const sheet = (src, frames, fps, columns, contentTop, contentHeight, footX) =>
  ({ src, frames, fps, columns, contentTop, contentHeight, footX, img: Object.assign(new Image(), { src }) });
// The numbers animate-player.js printed, and game.js's for today's.
const NEW = {
  idle: sheet("../assets/sprites/player/macario-new-idle.png", 24, 12, 6, 4, 358, 94),
  walk: sheet("../assets/sprites/player/macario-new-walk.png", 20, 30, 6, 4, 358, 94),
};
const OLD = {
  idle: sheet("../assets/sprites/player/macario-idle.png", 16, 6, 5, 73, 106, 130),
  walk: sheet("../assets/sprites/player/macario-walk.png", 20, 12, 5, 60, 127, 126),
};
const street = Object.assign(new Image(), { src: "../assets/backgrounds/act1/street-02.jpg" });

const cv = document.getElementById("c"), g = cv.getContext("2d");
const info = document.getElementById("info");
let held = 0, facing = 1, worldX = 0, last = 0, vt = 0;
const actors = [{ name: "Today", sheets: OLD }, { name: "New", sheets: NEW }]
  .map((a) => Object.assign(a, { anim: "idle", frame: 0, clock: 0 }));

function step(a, now, dt, oldTimer) {
  const s = a.sheets[a.anim], dur = 1000 / s.fps;
  if (oldTimer) {
    // game.js today: lastFrameTime = now, so each frame waits for the
    // first refresh after its time is up.
    if (now - a.clock >= dur) { a.clock = now; a.frame = (a.frame + 1) % s.frames; }
  } else {
    a.clock += dt;
    while (a.clock >= dur) { a.clock -= dur; a.frame = (a.frame + 1) % s.frames; }
  }
}

function drawActor(a, cx, groundY) {
  const s = a.sheets[a.anim];
  if (!s.img.complete || !s.img.naturalWidth) return;
  const rows = Math.ceil(s.frames / s.columns);
  const fw = s.img.naturalWidth / s.columns, fh = s.img.naturalHeight / rows;
  const k = H / s.contentHeight;
  const col = a.frame % s.columns, row = Math.floor(a.frame / s.columns);
  g.save();
  g.translate(cx, groundY);
  g.scale(facing, 1);
  g.drawImage(s.img, col * fw, row * fh, fw, fh,
    -s.footX * k, -(s.contentTop + s.contentHeight) * k, fw * k, fh * k);
  g.restore();
}

function frame(now) {
  const slow = document.getElementById("slow").checked ? 0.25 : 1;
  const oldTimer = document.getElementById("oldTimer").checked;
  const dt = last ? Math.min(now - last, 50) * slow : 0;
  last = now;
  vt += dt;
  if (held) facing = held;
  worldX += held * SPEED * dt / 1000;
  const who = document.querySelector("input[name=who]:checked").value;
  const shown = actors.filter((a) => who === "both" || (who === "new") === (a.sheets === NEW));
  for (const a of actors) {
    const want = held ? "walk" : "idle";
    if (a.anim !== want) { a.anim = want; a.frame = 0; a.clock = oldTimer ? vt : 0; }
    step(a, vt, dt, oldTimer);
  }

  const W = cv.width, GH = cv.height - 44;
  g.fillStyle = "#000"; g.fillRect(0, 0, W, cv.height);
  if (street.complete && street.naturalWidth) {
    const bh = cv.height, bw = street.naturalWidth * bh / street.naturalHeight;
    const off = ((worldX * ZOOM) % bw + bw) % bw;
    for (let x = -off; x < W; x += bw) g.drawImage(street, x, 0, bw, bh);
  }
  g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(0, GH, W, 44);
  g.fillStyle = "#ffd400";
  const tick = 30 * ZOOM, off = ((worldX * ZOOM) % tick + tick) % tick;
  for (let x = -off; x < W; x += tick) g.fillRect(Math.round(x), GH + 2, 2, 12);
  shown.forEach((a, i) => {
    const cx = shown.length === 1 ? W / 2 : W * (i ? 0.7 : 0.3);
    drawActor(a, cx, GH);
    g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(cx - 70, 8, 140, 24);
    g.fillStyle = "#fff"; g.textAlign = "center"; g.font = "14px system-ui";
    g.fillText(a.name + " · " + a.anim + " " + a.frame, cx, 25);
  });
  info.textContent = (held ? "running" : "standing") + " · world x " + worldX.toFixed(0) +
    (oldTimer ? " · today's timer" : " · true timer") + (slow < 1 ? " · quarter speed" : "");
  requestAnimationFrame(frame);
}

const press = (d) => () => { held = d; };
const release = () => { held = 0; };
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") held = -1;
  if (e.key === "ArrowRight" || e.key === "d") held = 1;
});
addEventListener("keyup", (e) => {
  if ((e.key === "ArrowLeft" || e.key === "a") && held < 0) held = 0;
  if ((e.key === "ArrowRight" || e.key === "d") && held > 0) held = 0;
});
for (const [id, d] of [["left", -1], ["right", 1]]) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", press(d));
  b.addEventListener("pointerup", release);
  b.addEventListener("pointerleave", release);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
