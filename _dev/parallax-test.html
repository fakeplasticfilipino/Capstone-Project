<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax test</title>
<!--
  Parallax test page (21 Oct 2026, Julian's experiment). Standalone: it
  loads nothing from js/ or css/ and the game never loads it, so deleting
  this one file is the whole revert. Open it through the same local server
  as the game (it borrows Macario's walk and idle sheets from assets/).

  Layers, far to near, each moved by translateX(-cameraX * rate):
    sky 0 (held still), far mountains 0.1, hills 0.3, trees 0.6,
    street 1 (the play layer: the road, the houses, Macario), front 1.25.
  The scenery is drawn here as SVG shapes, stand-ins for the artist's
  layers, never for use in the game itself.
-->
<style>
  :root {
    --sky-top: #6fb3d9; --sky-bottom: #f3dfb4; --sun: #fff3c4;
    --cloud: rgba(255, 255, 255, 0.85);
    --far: #8fa9b8; --hills: #6d9468; --hills-dark: #557a52;
    --trees: #3f6b3a; --trunk: #6b4a2e;
    --road: #a07a52; --road-dark: #87633f;
    --wall: #c9a46b; --wall-dark: #a9844f; --roof: #8a6a3a; --roof-dark: #6e5230;
    --win: #3a2a1a; --front: #2a3a20;
    --tint: rgba(0, 0, 0, 0); --stars: 0;
  }
  body.dusk {
    --sky-top: #4a4f8a; --sky-bottom: #f0a060; --sun: #ffb070;
    --cloud: rgba(255, 200, 170, 0.75);
    --far: #7a6a8a; --hills: #5a6a50; --hills-dark: #46553e;
    --trees: #33452c; --trunk: #4e3522;
    --road: #8a6448; --road-dark: #6e4e36;
    --wall: #b0805a; --wall-dark: #8e6644; --roof: #6e4c2c; --roof-dark: #553a22;
    --win: #ffb85a; --front: #1e2618;
    --tint: rgba(80, 30, 60, 0.12);
  }
  body.night {
    --sky-top: #0b1030; --sky-bottom: #2a3460; --sun: #f0f0dc;
    --cloud: rgba(120, 130, 170, 0.45);
    --far: #2a3350; --hills: #1f2c34; --hills-dark: #18232a;
    --trees: #142020; --trunk: #1c1812;
    --road: #3a3430; --road-dark: #2c2724;
    --wall: #4a4038; --wall-dark: #3a322c; --roof: #2e261e; --roof-dark: #241d17;
    --win: #ffc861; --front: #0a100c;
    --tint: rgba(10, 20, 60, 0.25); --stars: 1;
  }

  html, body { margin: 0; height: 100%; background: #22170f; color: #f5efe0;
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  /* The game's zoom (css/style.css): the world is shown at 1.75 on a
     desktop and 0.7 on a phone held sideways, so sizes here match it. */
  :root { --zoom: 1.75; }
  @media (orientation: landscape) and (max-height: 500px) { :root { --zoom: 0.7; } }
  #app-scale { width: calc(100% / var(--zoom)); height: calc(100% / var(--zoom));
    transform: scale(var(--zoom)); transform-origin: top left; }
  #viewport { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom)); }
  .layer { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
  .layer { background-repeat: repeat-x; background-size: auto 100%;
    background-position: left bottom; }
  .layer svg { position: absolute; left: 0; bottom: 0; display: block; }
  #tint { position: absolute; inset: 0; background: var(--tint); pointer-events: none; }
  #layer-front svg { filter: blur(1.5px); }
  body.no-front #layer-front { display: none; }

  .sun { fill: var(--sun); }
  .cloud { fill: var(--cloud); }
  .star { fill: #fff; opacity: var(--stars); }
  .far { fill: var(--far); }
  .hills { fill: var(--hills); }
  .hills-dark { fill: var(--hills-dark); }
  .trees { fill: var(--trees); }
  .trees-line { stroke: var(--trees); fill: none; }
  .trunk { stroke: var(--trunk); fill: none; }
  .road { fill: var(--road); }
  .road-dark { fill: var(--road-dark); }
  .wall { fill: var(--wall); }
  .wall-dark { fill: var(--wall-dark); }
  .slat { stroke: var(--wall-dark); }
  .roof { fill: var(--roof); }
  .roof-dark { fill: var(--roof-dark); }
  .post { stroke: var(--roof-dark); }
  .win { fill: var(--win); }
  .front { fill: var(--front); }
  .front-line { stroke: var(--front); fill: none; }

  .road-strip { position: absolute; left: 0; right: 0; bottom: 0;
    background-repeat: repeat-x; background-size: auto 100%; }
  .building { position: absolute; transform-origin: left bottom; }
  #macario { position: absolute; left: 0; bottom: 0; background-repeat: no-repeat;
    image-rendering: auto; }

  #panel { position: absolute; top: 8px; left: 8px; right: 8px; display: flex;
    flex-wrap: wrap; gap: 6px; align-items: center; z-index: 5; }
  #panel button { font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #6d5842; background: rgba(34, 23, 15, 0.85); color: #f5efe0; }
  #panel button[aria-pressed="true"] { background: #43a047; border-color: #1b5e20; }
  #hint { font-size: 12px; color: #f5efe0; background: rgba(34, 23, 15, 0.7);
    padding: 4px 8px; border-radius: 6px; }
  .pad { position: absolute; bottom: 12px; z-index: 5; width: 64px; height: 64px;
    border-radius: 50%; border: 1px solid #6d5842; background: rgba(34, 23, 15, 0.6);
    color: #f5efe0; font-size: 26px; touch-action: none; user-select: none; }
  #pad-left { left: 12px; } #pad-right { left: 88px; }
</style>
</head>
<body>
<div id="app-scale"><div id="viewport">
  <div class="layer" id="layer-sky"></div>
  <div class="layer" id="layer-far"></div>
  <div class="layer" id="layer-hills"></div>
  <div class="layer" id="layer-trees"></div>
  <div class="layer" id="layer-street"><div id="macario"></div></div>
  <div class="layer" id="layer-front"></div>
  <div id="tint"></div>
</div></div>

<div id="panel">
  <button id="btn-parallax" aria-pressed="true">Parallax: on</button>
  <button id="btn-front" aria-pressed="true">Foreground: on</button>
  <button id="btn-tondo" aria-pressed="false">Tondo art: off</button>
  <button data-time="day" aria-pressed="true">Day</button>
  <button data-time="dusk" aria-pressed="false">Dusk</button>
  <button data-time="night" aria-pressed="false">Night</button>
  <span id="hint">Walk with ← → or A D (or hold the pads). Turn parallax off to
    see the flat way the game draws a street today.</span>
</div>
<button class="pad" id="pad-left" aria-label="Walk left">◀</button>
<button class="pad" id="pad-right" aria-label="Walk right">▶</button>

<script>
"use strict";

// Kept the same as the game (js/game.js, css/style.css) so the feel matches.
const WORLD_WIDTH = 4400;
const GROUND_LEVEL = 60;
const SPEED = 5;
const DISPLAY_HEIGHT = 134;

// rate: how much of the camera's travel the layer moves (0 holds still on
// the screen, 1 is the road). flatRate is the same layer with parallax off.
const LAYERS = [
  { id: "sky",    rate: 0,    flatRate: 0, draw: drawSky },
  { id: "far",    rate: 0.1,  flatRate: 1, draw: drawFar },
  { id: "hills",  rate: 0.3,  flatRate: 1, draw: drawHills },
  { id: "trees",  rate: 0.6,  flatRate: 1, draw: drawTrees },
  { id: "street", rate: 1,    flatRate: 1, draw: drawStreet },
  { id: "front",  rate: 1.25, flatRate: 1, draw: drawFront },
];

const SHEETS = {
  idle: { src: "../assets/sprites/player/macario-idle.png", frames: 16, fps: 6, columns: 5,
          contentTop: 73, contentHeight: 106, footX: 130 },
  walk: { src: "../assets/sprites/player/macario-walk.png", frames: 20, fps: 12, columns: 5,
          contentTop: 60, contentHeight: 127, footX: 126 },
};
const CELL = 256;

// --- Seeded randomness, so the same scenery is drawn on every load ---------
function rng(seed) {
  return () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

// A ridge line: a few sine waves of random phase added together, sampled
// every step px, closed down to the bottom of the svg.
function ridge(width, height, base, amp, waves, seed, step = 20) {
  const r = rng(seed);
  const parts = waves.map((len) => ({ len, phase: r() * Math.PI * 2, a: 0.5 + r() }));
  const total = parts.reduce((s, p) => s + p.a, 0);
  let d = `M0 ${height}`;
  for (let x = 0; x <= width + step; x += step) {
    let y = 0;
    for (const p of parts) y += Math.sin(x / p.len + p.phase) * p.a;
    d += ` L${x} ${(base - (y / total) * amp).toFixed(1)}`;
  }
  return d + ` L${width + step} ${height} Z`;
}

function svg(width, height, inner) {
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${inner}</svg>`;
}

// --- Layers -------------------------------------------------------------
// Each draw(width, height) returns the layer's svg, width being how wide
// the layer has to be to cover the world at its rate.

function drawSky(width, height) {
  const r = rng(7);
  let inner = `<circle class="sun" cx="${width * 0.72}" cy="${height * 0.22}" r="38"/>`;
  for (let i = 0; i < 70; i++) {
    inner += `<circle class="star" cx="${(r() * width).toFixed(0)}" cy="${(r() * height * 0.55).toFixed(0)}" r="${(0.6 + r() * 1.2).toFixed(1)}"/>`;
  }
  // The clouds are drawn twice, a layer's width apart, so their drift
  // (in frame) wraps around without a jump.
  let clouds = "";
  for (let i = 0; i < 6; i++) {
    const cx = r() * width, cy = height * (0.1 + r() * 0.25), s = 0.6 + r() * 0.8;
    clouds += `<g class="cloud" transform="translate(${cx.toFixed(0)} ${cy.toFixed(0)}) scale(${s.toFixed(2)})">
      <ellipse cx="0" cy="0" rx="60" ry="18"/><ellipse cx="-30" cy="-8" rx="30" ry="18"/>
      <ellipse cx="20" cy="-14" rx="36" ry="22"/></g>`;
  }
  inner += `<g id="clouds">${clouds}<g transform="translate(${-width} 0)">${clouds}</g></g>`;
  return svg(width, height, inner);
}

function drawFar(width, height) {
  const base = height - GROUND_LEVEL - 150;
  return svg(width, height,
    `<path class="far" d="${ridge(width, height, base - 40, 110, [180, 90, 47], 11)}"/>`);
}

function drawHills(width, height) {
  const base = height - GROUND_LEVEL - 70;
  const r = rng(23);
  let inner = `<path class="hills" d="${ridge(width, height, base - 20, 50, [240, 110, 61], 17)}"/>`;
  // A tree line along the hills: little round crowns.
  for (let x = 0; x < width; x += 14 + r() * 18) {
    const y = base + 10 + r() * 20;
    inner += `<circle class="hills-dark" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(10 + r() * 10).toFixed(0)}"/>`;
  }
  inner += `<rect class="hills-dark" x="0" y="${base + 20}" width="${width}" height="${height}"/>`;
  return svg(width, height, inner);
}

function palm(x, groundY, h, lean) {
  const topX = x + lean, topY = groundY - h;
  let g = `<path class="trunk" stroke-width="7" stroke-linecap="round"
    d="M${x} ${groundY} Q${x + lean * 0.2} ${groundY - h * 0.5} ${topX} ${topY}"/>`;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI + (i / 6) * Math.PI;
    const ex = topX + Math.cos(a) * 55, ey = topY + Math.sin(a) * 22 + 26;
    const mx = topX + Math.cos(a) * 30, my = topY + Math.sin(a) * 30 - 6;
    g += `<path class="trees-line" stroke-width="9" stroke-linecap="round"
      d="M${topX} ${topY} Q${mx.toFixed(0)} ${my.toFixed(0)} ${ex.toFixed(0)} ${ey.toFixed(0)}"/>`;
  }
  return g;
}

function bamboo(x, groundY, h, r) {
  let g = "";
  for (let i = 0; i < 6; i++) {
    const bx = x + i * 6, bend = (r() - 0.3) * 50, th = h * (0.7 + r() * 0.3);
    g += `<path class="trees-line" stroke-width="4"
      d="M${bx} ${groundY} Q${bx + bend * 0.3} ${groundY - th * 0.6} ${bx + bend} ${groundY - th}"/>`;
  }
  // Leaves bunched along the upper stalks rather than one ball on top.
  for (let k = 0; k < 7; k++) {
    const t = 0.45 + r() * 0.5;
    g += `<ellipse class="trees" cx="${(x + 15 + (r() - 0.4) * 50 * t).toFixed(0)}" cy="${(groundY - h * t).toFixed(0)}"
      rx="${(14 + r() * 10).toFixed(0)}" ry="${(7 + r() * 5).toFixed(0)}"/>`;
  }
  return g;
}

function drawTrees(width, height) {
  const groundY = height - GROUND_LEVEL - 20;
  const r = rng(31);
  let inner = "";
  for (let x = 30; x < width; x += 120 + r() * 220) {
    inner += r() < 0.6
      ? palm(x, groundY, 170 + r() * 90, (r() - 0.5) * 70)
      : bamboo(x, groundY, 150 + r() * 70, r);
  }
  inner += `<rect class="trees" x="0" y="${groundY - 4}" width="${width}" height="${height}"/>`;
  return svg(width, height, inner);
}

// A nipa house on stilts: posts, a slatted bamboo wall, a thatched roof,
// a window and a door with a ladder. w wide, standing on groundY.
function nipaHouse(x, groundY, w, door) {
  const stilts = 34, wallH = 70, roofH = 62;
  const wallTop = groundY - stilts - wallH;
  let g = "";
  for (let px = x + 8; px < x + w; px += (w - 16) / 3) {
    g += `<line class="post" stroke-width="6" x1="${px}" y1="${groundY}" x2="${px}" y2="${groundY - stilts}"/>`;
  }
  g += `<rect class="wall" x="${x}" y="${wallTop}" width="${w}" height="${wallH}"/>`;
  for (let sx = x + 6; sx < x + w; sx += 7) {
    g += `<line class="slat" stroke-width="1.5" x1="${sx}" y1="${wallTop}" x2="${sx}" y2="${wallTop + wallH}"/>`;
  }
  g += `<rect class="wall-dark" x="${x}" y="${wallTop + wallH - 6}" width="${w}" height="6"/>`;
  g += `<rect class="win" x="${x + w * 0.62}" y="${wallTop + 16}" width="${w * 0.22}" height="24"/>`;
  if (door) {
    const dx = x + w * 0.16, dw = w * 0.22;
    g += `<rect class="win" x="${dx}" y="${wallTop + 12}" width="${dw}" height="${wallH - 12}"/>`;
    g += `<line class="post" stroke-width="3" x1="${dx}" y1="${groundY - stilts}" x2="${dx - 18}" y2="${groundY}"/>`;
    g += `<line class="post" stroke-width="3" x1="${dx + dw}" y1="${groundY - stilts}" x2="${dx + dw - 18}" y2="${groundY}"/>`;
    for (let k = 1; k < 4; k++) {
      const t = k / 4, ly = groundY - stilts + stilts * t;
      g += `<line class="post" stroke-width="2.5" x1="${dx - 18 * t}" y1="${ly}" x2="${dx + dw - 18 * t}" y2="${ly}"/>`;
    }
  }
  const eave = 16;
  g += `<path class="roof" d="M${x - eave} ${wallTop + 4} L${x + w * 0.5} ${wallTop - roofH} L${x + w + eave} ${wallTop + 4} Z"/>`;
  for (let k = 1; k < 4; k++) {
    const y = wallTop + 4 - (roofH * k) / 4, half = (w / 2 + eave) * (1 - k / 4);
    g += `<line class="post" stroke-width="1.5" x1="${x + w / 2 - half}" y1="${y}" x2="${x + w / 2 + half}" y2="${y}"/>`;
  }
  return g;
}

function drawStreet(width, height) {
  const groundY = height - GROUND_LEVEL;
  const r = rng(43);
  let inner = "";
  for (let x = 140; x < width - 200; x += 420 + r() * 260) {
    inner += nipaHouse(x, groundY + 6, 150 + r() * 60, r() < 0.7);
    // A bamboo fence beside some houses.
    if (r() < 0.5) {
      const fx = x + 230;
      for (let k = 0; k < 8; k++) {
        inner += `<line class="post" stroke-width="4" x1="${fx + k * 12}" y1="${groundY + 6}" x2="${fx + k * 12}" y2="${groundY - 30}"/>`;
      }
      inner += `<line class="post" stroke-width="3" x1="${fx - 4}" y1="${groundY - 18}" x2="${fx + 92}" y2="${groundY - 18}"/>`;
    }
  }
  inner += `<rect class="road" x="0" y="${groundY}" width="${width}" height="${GROUND_LEVEL}"/>`;
  for (let x = 0; x < width; x += 10 + r() * 30) {
    inner += `<rect class="road-dark" x="${x.toFixed(0)}" y="${(groundY + 6 + r() * (GROUND_LEVEL - 10)).toFixed(0)}" width="${(4 + r() * 10).toFixed(0)}" height="3"/>`;
  }
  return svg(width, height, inner);
}

function drawFront(width, height) {
  const r = rng(59);
  let inner = "";
  for (let x = 80; x < width; x += 300 + r() * 500) {
    if (r() < 0.35) {
      // A post, crossing the whole screen height near its base.
      inner += `<rect class="front" x="${x}" y="${height - 190}" width="18" height="190"/>`;
    } else {
      for (let k = 0; k < 9; k++) {
        const bx = x + k * 7, h = 40 + r() * 50, bend = (r() - 0.5) * 30;
        inner += `<path class="front-line" stroke-width="5" stroke-linecap="round"
          d="M${bx} ${height} Q${bx + bend * 0.4} ${height - h * 0.6} ${bx + bend} ${height - h}"/>`;
      }
    }
  }
  return svg(width, height, inner);
}

// --- Building the layers --------------------------------------------------
const viewport = document.getElementById("viewport");
let parallaxOn = true;
let viewW = 0, viewH = 0, skyWidth = 1;
const layerEls = {};

function rateOf(layer) { return parallaxOn ? layer.rate : layer.flatRate; }

// Every layer is drawn as wide as it needs to be at its parallax rate to
// cover the world from end to end (0 is just one screen, 1 is the world).
function buildLayers() {
  viewW = viewport.clientWidth;
  viewH = viewport.clientHeight;
  for (const layer of LAYERS) {
    const el = document.getElementById("layer-" + layer.id);
    const width = Math.ceil(Math.max(layer.rate, layer.flatRate) * (WORLD_WIDTH - viewW) + viewW) + 40;
    el.style.width = width + "px";
    if (layer.id === "sky") skyWidth = width;
    const keep = layer.id === "street" ? macarioEl : null;
    const art = sceneArt(layer.id);
    el.innerHTML = tondo && layer.id === "street" ? drawTondoStreet()
      : art === null ? layer.draw(width, viewH) : "";
    el.style.backgroundImage = art ? `url("${art.src}")` : "";
    el.style.backgroundSize = art ? `auto ${art.height * 100}%` : "";
    el.style.backgroundPosition = art ? `left bottom ${art.lift}px` : "";
    el.style.filter = art ? art.haze : "";
    if (keep) el.appendChild(keep);
    layerEls[layer.id] = el;
  }
  lastCameraX = null;
}

// --- Painted layers (the Tondo button) ------------------------------------
// Pictures dropped in _dev/parallax-art/ replace the drawn layers they name;
// one that is missing leaves the drawn layer in its place. Each is laid
// across its layer at the screen's full height, repeated left to right,
// bottom-anchored like the game's paintings.
// height: the share of the screen the picture is drawn at; lift: how far
// above the bottom it stands; haze: a filter that pushes it back.
const TONDO_ART = {
  // sky, clouds, the bay: replaces sky + mountains
  sky: { src: "parallax-art/tondo-nature.png", height: 1, lift: 0, haze: "" },
  // the tree line, smaller and paler so it reads as behind the houses:
  // replaces hills + trees
  hills: { src: "parallax-art/tondo-trees.png", height: 0.62, lift: GROUND_LEVEL + 4,
           haze: "saturate(0.75) brightness(1.08) contrast(0.9)" },
};

// The Tondo street, built from the buildings cropped out of the
// artist's sheet (parallax-art/buildings/), all drawn at one scale so
// they keep the sizes the sheet gave them. x is each building's left edge
// in the world; the road is Tondo's dirt, as in the game (GROUND_SRC).
const BUILDING_SCALE = 1.1;
const TONDO_STREET = [
  { name: "bahay-kubo", x: 150 },
  { name: "tienda", x: 700 },
  { name: "bahay-na-bato", x: 1200 },
  { name: "palengke", x: 1850 },
  { name: "simbahan", x: 2550 },
  { name: "bahay-balkonahe", x: 3250 },
  { name: "bahay-kubo", x: 3850 },
];
const ROAD_SRC = "../assets/backgrounds/act1/ground-lupa.jpg";

function drawTondoStreet() {
  let html = `<div class="road-strip" style="height:${GROUND_LEVEL + 14}px;background-image:url('${ROAD_SRC}')"></div>`;
  for (const b of TONDO_STREET) {
    html += `<img class="building" src="parallax-art/buildings/${b.name}.png" alt=""
      style="left:${b.x}px;bottom:${GROUND_LEVEL + 6}px;transform:scale(${BUILDING_SCALE})">`;
  }
  return html;
}
const HIDDEN_BY = { far: "sky", trees: "hills" };
const artLoaded = {};
let tondo = false;

for (const [id, { src }] of Object.entries(TONDO_ART)) {
  const img = new Image();
  img.onload = () => { artLoaded[id] = true; if (tondo) buildLayers(); };
  img.src = src;
}

// The picture for a layer in this scene: its TONDO_ART entry, "" for a
// layer hidden behind a picture, or null to draw it.
function sceneArt(id) {
  if (!tondo) return null;
  if (artLoaded[id]) return TONDO_ART[id];
  if (HIDDEN_BY[id] && artLoaded[HIDDEN_BY[id]]) return "";
  return null;
}

// --- Macario ------------------------------------------------------------
const macarioEl = document.getElementById("macario");
const player = { x: 400, facing: 1, moving: false, frame: 0, frameTime: 0, sheet: null };

function setSheet(name) {
  const s = SHEETS[name];
  if (player.sheet === s) return;
  player.sheet = s;
  player.frame = 0;
  const scale = DISPLAY_HEIGHT / s.contentHeight;
  const rows = Math.ceil(s.frames / s.columns);
  macarioEl.style.width = CELL * scale + "px";
  macarioEl.style.height = CELL * scale + "px";
  macarioEl.style.backgroundImage = `url("${s.src}")`;
  macarioEl.style.backgroundSize = `${s.columns * CELL * scale}px ${rows * CELL * scale}px`;
  macarioEl.style.transformOrigin = `${s.footX * scale}px 0`;
}

function drawMacario() {
  const s = player.sheet, scale = DISPLAY_HEIGHT / s.contentHeight;
  const col = player.frame % s.columns, row = Math.floor(player.frame / s.columns);
  const below = (CELL - s.contentTop - s.contentHeight) * scale;
  macarioEl.style.backgroundPosition = `${-col * CELL * scale}px ${-row * CELL * scale}px`;
  macarioEl.style.left = player.x - s.footX * scale + "px";
  macarioEl.style.bottom = GROUND_LEVEL - below + "px";
  macarioEl.style.transform = player.facing < 0 ? "scaleX(-1)" : "";
}

// --- Input --------------------------------------------------------------
const held = { left: false, right: false };
const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
addEventListener("keydown", (e) => { if (KEYS[e.key]) { held[KEYS[e.key]] = true; e.preventDefault(); } });
addEventListener("keyup", (e) => { if (KEYS[e.key]) held[KEYS[e.key]] = false; });
for (const [id, dir] of [["pad-left", "left"], ["pad-right", "right"]]) {
  const pad = document.getElementById(id);
  pad.addEventListener("pointerdown", (e) => { held[dir] = true; pad.setPointerCapture(e.pointerId); });
  for (const ev of ["pointerup", "pointercancel"]) pad.addEventListener(ev, () => { held[dir] = false; });
}

// --- The panel ----------------------------------------------------------
const btnParallax = document.getElementById("btn-parallax");
btnParallax.addEventListener("click", () => {
  parallaxOn = !parallaxOn;
  btnParallax.setAttribute("aria-pressed", parallaxOn);
  btnParallax.textContent = "Parallax: " + (parallaxOn ? "on" : "off");
  lastCameraX = null;
});
const btnTondo = document.getElementById("btn-tondo");
btnTondo.addEventListener("click", () => {
  tondo = !tondo;
  btnTondo.setAttribute("aria-pressed", tondo);
  btnTondo.textContent = "Tondo art: " + (tondo ? "on" : "off");
  buildLayers();
});
const btnFront = document.getElementById("btn-front");
btnFront.addEventListener("click", () => {
  const on = document.body.classList.toggle("no-front");
  btnFront.setAttribute("aria-pressed", !on);
  btnFront.textContent = "Foreground: " + (on ? "off" : "on");
});
for (const b of document.querySelectorAll("[data-time]")) {
  b.addEventListener("click", () => {
    document.body.classList.remove("dusk", "night");
    if (b.dataset.time !== "day") document.body.classList.add(b.dataset.time);
    for (const o of document.querySelectorAll("[data-time]")) o.setAttribute("aria-pressed", o === b);
  });
}

// --- The loop -----------------------------------------------------------
let lastCameraX = null, lastTime = performance.now();

function frame(now) {
  const dt = Math.min(50, now - lastTime);
  lastTime = now;
  const step = dt / (1000 / 60);

  const dir = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  player.moving = dir !== 0;
  if (dir) player.facing = dir;
  player.x = Math.max(40, Math.min(WORLD_WIDTH - 40, player.x + dir * SPEED * step));
  setSheet(player.moving ? "walk" : "idle");
  player.frameTime += dt;
  const perFrame = 1000 / player.sheet.fps;
  while (player.frameTime >= perFrame) {
    player.frameTime -= perFrame;
    player.frame = (player.frame + 1) % player.sheet.frames;
  }
  drawMacario();

  // The camera keeps Macario a little left of centre, inside the world.
  const cameraX = Math.max(0, Math.min(WORLD_WIDTH - viewW, player.x - viewW * 0.4));
  if (cameraX !== lastCameraX) {
    for (const layer of LAYERS) {
      layerEls[layer.id].style.transform = `translateX(${(-cameraX * rateOf(layer)).toFixed(1)}px)`;
    }
    lastCameraX = cameraX;
  }
  // The clouds drift on their own, slowly, whatever the camera does.
  const clouds = document.getElementById("clouds");
  if (clouds) clouds.setAttribute("transform", `translate(${((now / 120) % skyWidth).toFixed(1)} 0)`);

  requestAnimationFrame(frame);
}

let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildLayers, 150);
});

setSheet("idle");
buildLayers();
requestAnimationFrame(frame);
</script>
</body>
