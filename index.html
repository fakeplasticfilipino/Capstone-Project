<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Long Road</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div id="app-scale">
    <!-- Quest log -->
    <div id="quest-log">
      <div id="quest-log-title">Mga Gawain</div>
      <ul id="quest-list"></ul>
    </div>
    <div id="viewport">
      <div id="world">
        <div id="skyline"></div>
        <div id="skyline-night"></div>
        <div id="ground-tiles"></div>
        <!-- NPCs, decorations, and the stage are created dynamically by
             game.js from whichever act file is loaded (content/actN.js) -->
        <div id="player" class="entity">
          <div class="sprite player-sprite"></div>
        </div>
      </div>
    </div>
    <button id="gift-btn" class="hidden"></button>
    <div id="blackout"></div>
    <div id="dialogue-box" class="hidden">
      <div id="dialogue-inner">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-continue">tap / press E to continue</div>
      </div>
    </div>
    <!-- Health and transient messages. Hidden outside scenes that can
         damage the player, so the road is uncluttered. -->
    <div id="hud" class="hidden">
      <div id="hud-hearts"></div>
    </div>
    <div id="toast" class="hidden"></div>

    <!-- Mobile controls -->
    <div id="mobile-controls">
      <div class="dpad">
        <button id="btn-left" class="touch-btn">A</button>
        <button id="btn-right" class="touch-btn">D</button>
      </div>
      <div class="action-cluster">
        <!-- Attack is press and hold: a tap swings, holding throws. -->
        <button id="btn-attack" class="touch-btn">Atake</button>
        <button id="btn-jump" class="touch-btn">Talon</button>
        <button id="btn-interact" class="touch-btn interact-btn">E</button>
      </div>
    </div>
    <!-- Act title card and act transition screen.
         One overlay, two uses: acts.js fills in the slots and shows
         it on entering an act and again on finishing one. -->
    <div id="act-screen" class="hidden">
      <div id="act-screen-box">
        <div id="act-screen-eyebrow"></div>
        <h2 id="act-screen-title"></h2>
        <p id="act-screen-body"></p>
        <button id="act-screen-btn" type="button"></button>
      </div>
    </div>

    <!-- Trivia card, pre-test, and post-test.
         Owned by assessment.js. Kept separate from the act screen
         above because this one holds a question and answer choices
         and has to scroll on a small phone; that one never does. -->
    <div id="quiz" class="hidden">
      <div id="quiz-box">
        <div id="quiz-eyebrow"></div>
        <h2 id="quiz-title"></h2>
        <div id="quiz-progress"></div>
        <p id="quiz-question"></p>
        <div id="quiz-choices"></div>
        <div id="quiz-note"></div>
        <button id="quiz-btn" type="button"></button>
        <button id="quiz-back" type="button" class="hidden">Bumalik</button>
      </div>
    </div>

    <!-- Login / signup gate -->
    <div id="auth-overlay">
      <div id="auth-box">
        <h1 id="auth-title">MACARIO</h1>
        <p id="auth-subtitle">Mag-log in gamit ang account na ibinigay sa iyo</p>
        <form id="auth-form">
          <input id="auth-email" type="email" placeholder="Email" required autocomplete="email" />
          <input id="auth-password" type="password" placeholder="Password" required autocomplete="current-password" />
          <button id="auth-submit" type="submit">Log In</button>
        </form>
        <div id="auth-status"></div>
      </div>
    </div>
  </div>

  <!-- SCRIPT ORDER MATTERS.
       Act content files must load BEFORE game.js, because game.js
       reads window.ACT_1 on startup, and BEFORE acts.js, which reads
       all four to build its registry. Loading them in the wrong order
       gives a blank world and a console error.

       assessment.js loads last and is optional: with it absent the
       act flow collapses to playing then completed and the game still
       runs, which is how Block 2 was tested before Block 3 existed. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="content/act1.js?v=4"></script>
  <script src="content/act2.js?v=1"></script>
  <script src="content/act3.js?v=1"></script>
  <script src="content/act4.js?v=1"></script>
  <script src="game.js?v=9"></script>
  <script src="acts.js?v=3"></script>
  <script src="assessment.js?v=1"></script>
</body>
</html>
