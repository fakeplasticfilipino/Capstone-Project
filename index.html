<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Long Road</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-scale">
    <!-- Quest log -->
    <div id="quest-log">
      <div id="quest-log-title">Mga Gawain</div>
      <ul id="quest-list"></ul>
    </div>

    <div id="viewport">
      <div id="world">
        <div id="skyline"></div>
        <div id="skyline-night"></div>
        <div id="ground-tiles"></div>

        <!-- NPCs are created dynamically by game.js from the NPCS config -->

        <div id="player" class="entity">
          <div class="sprite player-sprite"></div>
        </div>
      </div>
    </div>

    <button id="gift-btn" class="hidden"></button>

    <div id="blackout"></div>

    <div id="dialogue-box" class="hidden">
      <div id="dialogue-inner">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-continue">tap / press E to continue</div>
      </div>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-controls">
      <div class="dpad">
        <button id="btn-left" class="touch-btn">A</button>
        <button id="btn-right" class="touch-btn">D</button>
      </div>
      <button id="btn-interact" class="touch-btn interact-btn">E</button>
    </div>

    <!-- Login / signup gate -->
    <div id="auth-overlay">
      <div id="auth-box">
        <h1 id="auth-title">MACARIO</h1>
        <p id="auth-subtitle">Mag-log in gamit ang account na ibinigay sa iyo</p>

        <form id="auth-form">
          <input id="auth-email" type="email" placeholder="Email" required autocomplete="email" />
          <input id="auth-password" type="password" placeholder="Password" required autocomplete="current-password" />
          <button id="auth-submit" type="submit">Log In</button>
        </form>

        <div id="auth-status"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
