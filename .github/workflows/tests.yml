# MACARIO: both suites on every push to main (Block 104).
#
# Pushing to main publishes to GitHub Pages, so this is the check that
# runs behind every push: GitHub starts a fresh machine, runs the two
# suites side by side, and marks the commit with a green tick or a red
# cross (the Actions tab on GitHub says which check failed). A push that
# changes only Markdown (the context files) cannot break the game and
# runs nothing. Before a release to students (the pilot, the freeze, the
# study) the suites are also run in full on the proponent's computer
# (CLAUDE.md, Deployment).

name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Block 106. The checks that need no browser (prepare.js --check: every
  # script compiles, STORY.md, ART.md, the manifest and its fingerprints,
  # the stamps, the shrunk sheets), in seconds and with nothing to
  # install, before the suites spend twelve minutes on a push that a
  # forgotten step has already broken.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node _dev/tools/prepare.js --check

  suite:
    needs: checks
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [test.js, verify_new_scene.js]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # package-lock.json is gitignored, so npm install, not npm ci.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node _dev/tests/${{ matrix.suite }}
