# MACARIO: both suites on every push to main (Block 104).
#
# Pushing to main publishes to GitHub Pages, so this is the check that
# runs behind every push: GitHub starts fresh machines, runs the two
# suites in pieces side by side (Block 115, _dev/tests/run.js), and marks the commit with a green tick or a red
# cross (the Actions tab on GitHub says which check failed). A push that
# changes only Markdown (the context files) cannot break the game, so
# since Block 121 it runs the checks alone (STORY.md and ART.md are
# checked there) and not the suites. Before a release to students (the pilot, the freeze, the
# study) the suites are also run in full on the proponent's computer
# (CLAUDE.md, Deployment).

name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Block 106. The checks that need no browser (prepare.js --check: every
  # script compiles, STORY.md, ART.md, the manifest and its fingerprints,
  # the stamps, the shrunk sheets), in seconds and with nothing to
  # install, before the suites spend twelve minutes on a push that a
  # forgotten step has already broken.
  # The runner is pinned (Polish list #9): ubuntu-latest moves to Ubuntu
  # 26 from 19 Oct 2026, and a new system under Playwright's browser is
  # the kind of change to make on purpose, not find in a red run.
  # Block 121: Node is pinned (24, the proponent's), not lts/*, for the
  # same reason as the runner. The job also says whether the push changed
  # anything but Markdown (code: true or false), which is what the suites
  # run on: a Markdown-only push is checked here and goes no further.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node _dev/tools/prepare.js --check
      # The files this push changed, against the commit before it (fetched
      # alone; two trees are compared, no history needed). Unknown (a new
      # branch, a manual run, a fetch that fails) counts as code.
      - id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          code=true
          zero=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "$zero" ] &&
             git fetch --quiet --depth=1 origin "$before"; then
            # false only when the diff was read, is not empty, and every
            # file in it is Markdown.
            if files=$(git diff --name-only "$before" "${{ github.sha }}") && [ -n "$files" ] &&
               ! printf '%s\n' "$files" | grep -qv '\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  # Block 115. The two suites cut into pieces (each part of
  # verify_new_scene.js, test.js's sections six at a time) and dealt to
  # four machines, two pieces at a time on each, with the story
  # fast-forwarded (game.js, TEST_SPEED). run.js --list shows the pieces.
  suite:
    needs: checks
    if: needs.checks.outputs.code == 'true'
    name: shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A newer push of code makes an older run of the suites pointless. Kept
    # to the suites (Block 121), so a Markdown push, which runs the checks
    # alone, never cancels the suites of the code pushed before it.
    concurrency:
      group: suite-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # package-lock.json is gitignored, so npm install, not npm ci.
      # Playwright's version is pinned exactly in package.json (Polish
      # list #9), so CI and the proponent's computer run the same browser.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Every FAIL line is also an annotation (Polish list #9): GitHub
      # shows a run's log only to someone signed in, but its annotations
      # to anyone, through the public API, so a red run says which check
      # failed without a login.
      - shell: bash
        run: |
          set -o pipefail
          status=0
          node _dev/tests/run.js --shard=${{ matrix.shard }}/4 --jobs=2 2>&1 | tee suite.log || status=$?
          grep -E "^\s*FAIL" suite.log | head -n 20 | sed -E 's/^\s*/::error title=shard ${{ matrix.shard }}::/' || true
          exit $status
