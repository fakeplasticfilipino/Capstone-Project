# MACARIO: both suites on every push to main (Block 104).
#
# Pushing to main publishes to GitHub Pages, so this is the check that
# runs behind every push: GitHub starts fresh machines, runs the two
# suites in pieces side by side (Block 115, _dev/tests/run.js), and marks the commit with a green tick or a red
# cross (the Actions tab on GitHub says which check failed). A push that
# changes only Markdown (the context files) cannot break the game and
# runs nothing. Before a release to students (the pilot, the freeze, the
# study) the suites are also run in full on the proponent's computer
# (CLAUDE.md, Deployment).

name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Block 106. The checks that need no browser (prepare.js --check: every
  # script compiles, STORY.md, ART.md, the manifest and its fingerprints,
  # the stamps, the shrunk sheets), in seconds and with nothing to
  # install, before the suites spend twelve minutes on a push that a
  # forgotten step has already broken.
  # The runner is pinned (Polish list #9): ubuntu-latest moves to Ubuntu
  # 26 from 19 Oct 2026, and a new system under Playwright's browser is
  # the kind of change to make on purpose, not find in a red run.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node _dev/tools/prepare.js --check

  # Block 115. The two suites cut into pieces (each part of
  # verify_new_scene.js, test.js's sections six at a time) and dealt to
  # four machines, two pieces at a time on each, with the story
  # fast-forwarded (game.js, TEST_SPEED). run.js --list shows the pieces.
  suite:
    needs: checks
    name: shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # package-lock.json is gitignored, so npm install, not npm ci.
      # Playwright's version is pinned exactly in package.json (Polish
      # list #9), so CI and the proponent's computer run the same browser.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Every FAIL line is also an annotation (Polish list #9): GitHub
      # shows a run's log only to someone signed in, but its annotations
      # to anyone, through the public API, so a red run says which check
      # failed without a login.
      - shell: bash
        run: |
          set -o pipefail
          status=0
          node _dev/tests/run.js --shard=${{ matrix.shard }}/4 --jobs=2 2>&1 | tee suite.log || status=$?
          grep -E "^\s*FAIL" suite.log | head -n 20 | sed -E 's/^\s*/::error title=shard ${{ matrix.shard }}::/' || true
          exit $status
